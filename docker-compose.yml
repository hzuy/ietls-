services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ielts-app-backend
    restart: unless-stopped
    ports:
      # Bind 127.0.0.1 only — KHÔNG mở ra Internet, chỉ Nginx trên cùng máy truy cập được
      - "127.0.0.1:5001:5001"
    environment:
      PORT: 5001
      NODE_ENV: production
    env_file:
      # File .env thật trên server (không commit lên git)
      - ./backend/.env
    volumes:
      # Persist uploads giữa các lần restart/redeploy
      - ./backend/uploads:/app/uploads
    # KHÔNG có depends_on: postgres-prod ở đây (P9 giai đoạn 1) — backend vẫn
    # đang chạy DATABASE_URL/DIRECT_URL trỏ Supabase, chưa cutover. Chỉ thêm
    # depends_on + đổi 2 biến trên khi thực sự cutover ở Giai đoạn 2 (xem
    # docs/deploy/self-hosted-postgres-migration.md).

  # ── postgres-prod — CHƯA ACTIVE, chỉ chuẩn bị cho Giai đoạn 2 (P9) ──────────
  # Service này chưa được backend sử dụng: chưa deploy lên lab46, chưa có
  # dữ liệu, chưa đổi DATABASE_URL/DIRECT_URL. Push lên server và `docker
  # compose up -d postgres-prod` thời điểm này chỉ tạo 1 Postgres rỗng chạy
  # song song, không ảnh hưởng backend đang chạy (không depends_on, không
  # network alias nào khác dùng tới).
  postgres-prod:
    # postgres:17 — KHỚP major version thật của Supabase (đo được: server
    # version 17.6 khi chạy dump-from-supabase.sh lần đầu, P9 Giai đoạn 2 Bước
    # 3). Ban đầu soạn postgres:16 ở Giai đoạn 1 mà không kiểm tra version thật
    # — pg_dump 16 từ chối dump server 17.x ("aborting because of server
    # version mismatch"). Đổi lên 17 để pg_dump/pg_restore cùng major version
    # với nguồn, tránh rủi ro không tương thích khi restore.
    image: postgres:17
    container_name: ielts-app-postgres
    restart: unless-stopped
    # KHÔNG map port ra host — chỉ backend (cùng docker network mặc định của
    # file compose này) truy cập qua tên service "postgres-prod:5432" khi
    # cutover. Không có "ports:" ở đây là cố ý.
    environment:
      # CHỈ 3 biến này — cố ý KHÔNG dùng env_file: ./backend/.env ở service
      # này (khác với backend/.env ở trên): backend/.env chứa DATABASE_URL/
      # JWT_SECRET/GROQ_API_KEY thật, không liên quan và không nên lọt vào
      # container Postgres. `docker compose config` từng in các secret đó ra
      # màn hình khi service này còn khai env_file — xem cảnh báo trong
      # docs/deploy/self-hosted-postgres-migration.md.
      POSTGRES_USER: ${POSTGRES_PROD_USER:-ielts_app}
      POSTGRES_PASSWORD: ${POSTGRES_PROD_PASSWORD}
      POSTGRES_DB: ${POSTGRES_PROD_DB:-ielts_app}
    volumes:
      # Named volume (Docker tự quản lý dưới /var/lib/docker/volumes/...)
      # — KHÔNG bind-mount vào /home/huuduy như frontend dist/, để tránh đúng
      # vấn đề SELinux context (user_home_t) đã gặp hôm nay.
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_PROD_USER:-ielts_app} -d ${POSTGRES_PROD_DB:-ielts_app}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_prod_data:
